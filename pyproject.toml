[tool.poetry]
name = "home-assistant-comfoconnect"
version = "0.7.0-rc5"
description = "Home Assistant Zehnder ComfoAirQ integration"
authors = ["Michaël Arnauts <michael.arnauts@gmail.com>"]
readme = "README.md"
packages = [{include = "custom_components/comfoconnect"}]

[tool.poetry.dependencies]
python = ">=3.14.2,<3.15"
aiocomfoconnect = "0.4.5"

[tool.poetry.group.dev.dependencies]
homeassistant = "2026.10.2"
pytest = "^9.0"
pytest-homeassistant-custom-component = "0.13.373"
ruff = "^0.17.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
extend-exclude = [
    "__pycache__",
    "build",
    "dist",
]
target-version = "py313"
line-length = 150
src = ["custom_components"]

[tool.ruff.lint]
extend-select = [
    "C4",
    "D200",
    "D201",
    "D204",
    "D205",
    "D206",
    "D210",
    "D211",
    "D213",
    "D300",
    "D400",
    "D402",
    "D403",
    "D404",
    "D419",
    "E",
    "F",
    "G010",
    "I001",
    "INP001",
    "N805",
    "PERF101",
    "PERF102",
    "PERF401",
    "PERF402",
    "PGH004",
    "PGH005",
    "PIE794",
    "PIE796",
    "PIE807",
    "PIE810",
    "RET502",
    "RET503",
    "RET504",
    "RET505",
    "RUF015",
    "RUF100",
    "S101",
    "T20",
    "W",
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to use assert, and don't need to be a package.
"tests/*" = ["S101", "INP001"]
