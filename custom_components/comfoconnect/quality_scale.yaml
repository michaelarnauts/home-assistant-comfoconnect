rules:
  # ──── Bronze ────
  action-setup: done
  appropriate-polling: todo
  brands: done
  common-modules: todo
  config-flow: todo
  config-flow-test-coverage: todo
  dependency-transparency: done
  docs-actions: todo
  docs-conditions:
    status: exempt
    comment: |
      Integration does not provide custom conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: |
      Integration does not provide custom triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: todo
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # ──── Silver ────
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: |
      Integration does not have an options flow.
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: todo

  # ──── Gold ────
  devices: done
  diagnostics: todo
  discovery: todo
  discovery-update-info: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: todo
    comment: |
      CO2 sensors get their own device, but only the ones on the bus at setup.
      One added later only appears after a reload.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices:
    status: done
    comment: |
      CO2 sensor devices can be removed from the UI once the sensor is gone from the bus.

  # ──── Platinum ────
  async-dependency: done
  inject-websession:
    status: exempt
    comment: |
      The aiocomfoconnect library uses a custom protobuf-over-TCP
      protocol to communicate with the ComfoConnect LAN C bridge.
      There is no HTTP/aiohttp websession to inject.
  strict-typing: todo
